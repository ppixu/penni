name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Two packages at a time: the PGlite, workerd and PDF tests are CPU-heavy and time out
      # when turbo runs every package in parallel on the 4-core runner.
      - run: pnpm exec turbo run test --concurrency=2
